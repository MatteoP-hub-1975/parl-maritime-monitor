name: daily-check

on:
  schedule:
    #- cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Europe/Rome
      DAYS_BACK: "7"
      LEGISLATURA: "19"

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_SERVER: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test imports
        run: |
          python - <<'PY'
          import requests
          import yaml
          print("OK - dependencies loaded")
          PY

      - name: Run monitor and send email
        run: python send_test_email.py
